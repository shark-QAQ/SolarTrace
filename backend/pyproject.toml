[project]
name = "solartrace"
version = "1.0.0"
description = "SolarTrace（光溯）· 光伏电站建设政策与规范智能问答平台（工业级 RAG）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.32",
    "httpx>=0.28.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.16.0",
]

# 本包仅作为依赖与工具配置容器（代码以源码运行），无需构建安装
[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "C4"]
ignore = ["E501", "B008", "UP035", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
