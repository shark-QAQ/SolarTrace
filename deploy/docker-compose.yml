# ============================================================
# SolarTrace（光溯）一键部署
# 用法： cd SolarTrace && docker compose -f deploy/docker-compose.yml up -d --build
# 前端: http://localhost:8080   后端: http://localhost:8000/api/v1/system/health
# Ollama 在宿主机运行，容器以 host.docker.internal 访问（Docker Desktop 支持）
# 启动 Qdrant 分布式向量模式： docker compose ... --profile qdrant up -d --build
# ============================================================
name: solartrace

services:
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: solartrace/api:1.0
    container_name: solartrace-api
    restart: unless-stopped
    environment:
      SOLARTRACE_ENVIRONMENT: production
      SOLARTRACE_SECRET_KEY: ${SOLARTRACE_SECRET_KEY:-please-change-me-solartrace-prod}
      SOLARTRACE_LOG_LEVEL: INFO
      SOLARTRACE_LOG_FORMAT: json
      SOLARTRACE_VECTOR_BACKEND: ${SOLARTRACE_VECTOR_BACKEND:-chroma}
      SOLARTRACE_QDRANT_URL: ${SOLARTRACE_QDRANT_URL:-http://qdrant:6333}
      SOLARTRACE_OLLAMA_BASE_URL: ${SOLARTRACE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SOLARTRACE_EMBEDDING_MODEL: ${SOLARTRACE_EMBEDDING_MODEL:-bge-m3}
      SOLARTRACE_LLM_MODEL: ${SOLARTRACE_LLM_MODEL:-qwen2.5:7b}
      SOLARTRACE_BOOTSTRAP_ADMIN_USERNAME: ${SOLARTRACE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SOLARTRACE_BOOTSTRAP_ADMIN_PASSWORD: ${SOLARTRACE_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      SOLARTRACE_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"
    volumes:
      - solartrace-data:/app/data
    networks: [solartrace-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 8s
      start_period: 90s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2", memory: 4G }

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    image: solartrace/web:1.0
    container_name: solartrace-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    networks: [solartrace-net]

  # 可选：分布式向量库（启用 --profile qdrant，并设 SOLARTRACE_VECTOR_BACKEND=qdrant）
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: solartrace-qdrant
    profiles: ["qdrant"]
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [solartrace-net]

volumes:
  solartrace-data: { driver: local }
  qdrant-data: { driver: local }

networks:
  solartrace-net:
    driver: bridge
    name: solartrace-network
